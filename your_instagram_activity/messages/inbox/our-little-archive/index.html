<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Little Archive ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: #09030a;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f5f5;
    }

    /* Ambient Radial Glow */
    .romantic-bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150vw;
      height: 150vh;
      background: radial-gradient(circle, rgba(255, 77, 109, 0.22) 0%, rgba(193, 53, 132, 0.12) 35%, rgba(9, 3, 10, 0.98) 70%);
      pointer-events: none;
    }

    /* Floating particles */
    .romantic-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .romantic-particle {
      position: absolute;
      color: rgba(255, 182, 193, 0.45);
      font-size: 14px;
      animation: floatParticle 9s infinite linear;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      80% {
        opacity: 0.7;
      }

      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Card */
    .romantic-card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 400px;
      background: rgba(24, 11, 26, 0.82);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 120, 150, 0.32);
      border-radius: 28px;
      padding: 40px 30px 34px;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 77, 109, 0.2);
      animation: romanticCardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes romanticCardFadeIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .romantic-header-icon {
      font-size: 36px;
      margin-bottom: 14px;
      display: inline-block;
      animation: romanticHeartPulse 2s infinite ease-in-out;
    }

    @keyframes romanticHeartPulse {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255, 77, 109, 0.5));
      }

      50% {
        transform: scale(1.2);
        filter: drop-shadow(0 0 14px rgba(255, 77, 109, 0.95));
      }
    }

    .romantic-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .romantic-date {
      font-size: 12px;
      font-weight: 700;
      color: #ff758c;
      letter-spacing: 1.2px;
      /* text-transform: uppercase; */
      margin-bottom: 12px;
    }

    .romantic-quote {
      font-size: 15px;
      font-style: italic;
      color: #ebd1df;
      margin-bottom: 4px;
      font-family: Georgia, serif;
    }

    .romantic-subtitle {
      font-size: 13px;
      color: #a88fa0;
      margin-bottom: 24px;
    }

    .romantic-form {
      margin-bottom: 24px;
    }

    .romantic-input-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .romantic-input-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 18px;
      border: 1px solid rgba(255, 120, 150, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.25s ease;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .romantic-input-wrapper input:focus {
      border-color: #ff477e;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(255, 71, 126, 0.35);
    }

    .romantic-input-wrapper input::placeholder {
      color: #8a7384;
    }

    .romantic-toggle-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      opacity: 0.6;
      font-size: 16px;
      user-select: none;
      transition: opacity 0.2s;
    }

    .romantic-toggle-eye:hover {
      opacity: 1;
    }

    .romantic-error {
      color: #ff4d6d;
      font-size: 12px;
      font-weight: 600;
      min-height: 20px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    .romantic-shake {
      animation: romanticShake 0.4s ease-in-out;
    }

    @keyframes romanticShake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-8px);
      }

      40%,
      80% {
        transform: translateX(8px);
      }
    }

    #romantic-open-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
      letter-spacing: 0.5px;
    }

    #romantic-open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 65, 108, 0.6);
      filter: brightness(1.08);
    }

    #romantic-open-btn:active {
      transform: translateY(1px);
    }

    .romantic-footer p {
      margin: 0 0 6px;
      font-size: 12px;
      color: #92778c;
      letter-spacing: 0.3px;
    }

    .romantic-stars {
      color: #ff758c;
      font-size: 12px;
      letter-spacing: 6px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="romantic-bg-glow"></div>
  <div class="romantic-particles" id="romantic-particles"></div>

  <div class="romantic-card">
    <div class="romantic-header-icon">❤️</div>
    <h1 class="romantic-title">Our Little Archive ❤️</h1>
    <div class="romantic-date">September 2025</div>
    <div class="romantic-quote">"Where our story started..."</div>
    <div class="romantic-subtitle">A place just for us</div>

    <div class="romantic-form">
      <div class="romantic-input-wrapper">
        <input type="password" id="romantic-pass-input" placeholder="Enter our secret..." autocomplete="off" />
        <span class="romantic-toggle-eye" onclick="togglePasswordVisibility()" title="Show/Hide secret">👁️</span>
      </div>
      <div id="romantic-error-msg" class="romantic-error"></div>
      <button id="romantic-open-btn" onclick="checkSecretPassword()">OPEN ❤️</button>
    </div>

    <div class="romantic-footer">
      <p>Made with love, for you</p>
      <div class="romantic-stars">✦ &nbsp; ✦ &nbsp; ✦</div>
    </div>
  </div>

  <script>
    const HARDCODED_PASS = "littlebaby";

    // Generate floating sparkles/hearts
    (function generateParticles() {
      const pContainer = document.getElementById('romantic-particles');
      if (pContainer) {
        const symbols = ['❤️', '✨', '🌸', '💖', '✦'];
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('div');
          p.className = 'romantic-particle';
          p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          p.style.left = Math.random() * 100 + '%';
          p.style.animationDelay = (Math.random() * 8) + 's';
          p.style.animationDuration = (7 + Math.random() * 6) + 's';
          p.style.fontSize = (12 + Math.random() * 12) + 'px';
          pContainer.appendChild(p);
        }
      }
    })();

    window.checkSecretPassword = function () {
      const input = document.getElementById('romantic-pass-input');
      const error = document.getElementById('romantic-error-msg');
      const card = document.querySelector('.romantic-card');
      if (!input) return;

      const val = input.value.trim();
      if (val === HARDCODED_PASS) {
        error.textContent = '';
        sessionStorage.setItem('archive_unlocked', 'true');
        const target = window.location.pathname.includes('/your_instagram_activity/') 
          ? 'message_1.html' 
          : 'your_instagram_activity/messages/inbox/our-little-archive/message_1.html';
        window.location.href = target;
      } else {
        error.textContent = 'Incorrect secret password... 💔';
        if (card) {
          card.classList.remove('romantic-shake');
          void card.offsetWidth;
          card.classList.add('romantic-shake');
        }
        input.value = '';
        input.focus();
      }
    };

    window.togglePasswordVisibility = function () {
      const input = document.getElementById('romantic-pass-input');
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
    };

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        checkSecretPassword();
      }
    });

    window.onload = function () {
      const passInp = document.getElementById('romantic-pass-input');
      if (passInp) passInp.focus();
    };
  </script>
</body>

</html>
